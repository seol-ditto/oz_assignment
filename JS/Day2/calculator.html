<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘솔창 계산기</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>콘솔창 계산기 프로그램</h1>
    <div class="container">
        <div class="os">
            <h3 id="window">Window OS</h3>
            <ol>
                <li>F12 키를 눌러 콘솔 창을 여세요.</li>
                <li>start()를 콘솔창에 입력하여 계산기를 실행합니다.</li>
            </ol>
        </div>
        <div class="os">
            <h3 id="mac">Mac OS</h3>
            <ol>
                <li>Option + Command + i 키를 눌러 콘솔 창을 여세요.</li>
                <li>start()를 콘솔창에 입력하여 계산기를 실행합니다.</li>
            </ol>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>

</html>
